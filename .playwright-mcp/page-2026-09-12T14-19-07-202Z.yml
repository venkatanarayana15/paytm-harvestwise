    - heading "A restocking loop that speaks, acts & remembers" [level=2] [ref=f1e109]
    - generic [ref=f1e110]:
      - generic [ref=f1e111]:
        - generic [ref=f1e112]:
          - generic [ref=f1e113]: 1 · OBSERVE
          - heading "👁️" [level=4] [ref=f1e114]
          - paragraph [ref=f1e115]: Watches her world — hourly UPI sales velocity (Paytm signals, with consent), IMD rain probability, festival calendar, mandi rates, and perishable decay tables per commodity.
        - generic [ref=f1e116]:
          - generic [ref=f1e117]: 2 · PREDICT
          - heading "🔮" [level=4] [ref=f1e118]
          - paragraph [ref=f1e119]: "Forecasts spoilage & demand in her words: \"Rain at 3 PM — coriander shelf-life drops to 4 hours; your rainy-day coriander sales fall 40%.\""
        - generic [ref=f1e120]:
          - generic [ref=f1e121]: 3 · ACT
          - heading "⚡" [level=4] [ref=f1e122]
          - paragraph [ref=f1e123]: Recalculates and dispatches — resizes her order (10 → 6 bundles), confirms with her by voice, sends the revised buy-order to her mandi wholesaler on WhatsApp.
        - generic [ref=f1e124]:
          - generic [ref=f1e125]: 4 · LEARN
          - heading "🧠" [level=4] [ref=f1e126]
          - paragraph [ref=f1e127]: Remembers her business — which recalcs worked, which didn't, and why. Next week's order starts from this week's evidence, not zero.
      - generic [ref=f1e128]:
        - generic [ref=f1e129]:
          - heading "No new app. No login. No literacy barrier." [level=4] [ref=f1e130]
          - paragraph [ref=f1e131]: The interface is voice on WhatsApp — plus the morning briefing played on her Paytm Soundbox. The Soundbox already sits on her cart, already speaks her language. We upgrade it from payment confirmation to operational assistant.
        - generic [ref=f1e132]:
          - heading "Not another chatbot" [level=4] [ref=f1e133]
          - paragraph [ref=f1e134]: Chatbots advise ("stock less"). HarvestWise finishes the job — it recalculates the order and dispatches it to the wholesaler, with a human voice-approval gate before anything that touches money.
    - generic [ref=f1e135]:
      - generic [ref=f1e136]: "One loop, every morning: Observe → Predict → Act → Learn."
      - generic [ref=f1e137]: Spoilage prevented before it's bought, orders dispatched before the mandi gate, outcomes measured the same evening — compounding daily into her take-home and Paytm's GMV.
    - generic [ref=f1e138]:

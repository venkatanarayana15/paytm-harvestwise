        - heading "The locked layer of value" [level=4] [ref=f1e50]
        - paragraph [ref=f1e51]: Paytm sees the transactions — but the merchant's most consequential decision, what to stock tomorrow at what quantity, happens blind at the mandi gate. Paytm's own AI (ARMS) optimizes merchant lifecycle internally; the merchant's own P&L still runs on intuition. That missing merchant-facing layer is where the next phase of Paytm's growth lives.
      - paragraph [ref=f1e53]: "Why now: Indic voice AI (Sarvam), agent orchestration (n8n) and knowledge-graph memory (Cognee) matured together for the first time — making a copilot for a non-English, non-dashboard user finally buildable."

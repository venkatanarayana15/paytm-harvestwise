    - heading "Her inventory rots. Her margin goes with it." [level=2] [ref=f1e62]
    - generic [ref=f1e63]:
      - generic [ref=f1e64]:
        - generic [ref=f1e65]:
          - generic [ref=f1e66]: "\"I'm at Kalasipalya mandi by 4:30 AM with ₹3,500 in my pocket. I buy tomatoes, greens and beans on one heuristic: what sold yesterday. At 3 PM an unpredicted thunderstorm empties the street. By 9 PM I'm dumping ₹400 of rotting greens in the garbage. I earn on Paytm. I restock on guesswork.\""
          - generic [ref=f1e67]: — Lakshmi · vegetable cart · Basavanagudi, Bengaluru
        - generic [ref=f1e68]:
          - generic [ref=f1e69]: ⚠
          - generic [ref=f1e70]: "Modeled across Bengaluru's 12,000+ vegetable vendors: ~₹175 Cr/yr in spoilage losses (₹400 × 12,000 × 365) — losses like these push vendors into informal high-interest debt (meter baddi). Baseline to be validated in pilot."
      - generic [ref=f1e71]:
        - generic [ref=f1e72]:
          - heading "🥀 25–35% daily spoilage" [level=4] [ref=f1e73]:
            - generic [ref=f1e74]: 🥀
            - text: 25–35% daily spoilage
          - paragraph [ref=f1e75]: Perishable stock bought at 4:30 AM on intuition, sold across a 12-hour day. Evening leftovers go out at distress prices — what doesn't sell is a 100% cash loss.
        - generic [ref=f1e76]:
          - heading "🎲 4:30 AM <—> 3 PM disconnect" [level=4] [ref=f1e77]:
            - generic [ref=f1e78]: 🎲
            - text: 4:30 AM <—> 3 PM disconnect
          - paragraph [ref=f1e79]: "Procurement decisions ignore the signals that actually move demand: afternoon rain, micro-festivals, local UPI purchase velocity, mandi price swings — all available, none connected."
        - generic [ref=f1e80]:
          - heading "📵 Tools not built for her" [level=4] [ref=f1e81]:
            - generic [ref=f1e82]: 📵
            - text: Tools not built for her
          - paragraph [ref=f1e83]: Dashboards need literacy, dry hands and downtime she doesn't have. Chatbots only talk. Wet hands, continuous customers, vernacular-only — the interface must be speech.

services:
  - type: web
    name: harvestwise-api
    runtime: python
    rootDir: finale
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SARVAM_API_KEY
        sync: false
      - key: COGNEE_BASE_URL
        sync: false
      - key: COGNEE_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: WA_AKG_URL
        sync: false
      - key: WA_AKG_SESSION
        sync: false
      - key: WA_AKG_API_KEY
        sync: false
      - key: COPILOT_ALLOWED_PHONES
        value: 917010919624
      - key: TWILIO_WHATSAPP_TO
        value: whatsapp:+917010919624
      - key: WEATHER_MODE
        value: seeded
      - key: LLM_MODE
        value: hybrid

  - type: web
    name: harvestwise-ui
    runtime: static
    rootDir: finale/ui
    buildCommand: echo "static"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
